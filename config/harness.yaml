validator_chain:
  price_check: { enabled: true, max_deviation_pct: 7.5 }
  quantity_check: { enabled: true }
  order_type_check: { enabled: true, allowed_types: [limit] }
  time_check: { enabled: false }
  frequency_limit: { enabled: false }
risk_controller:
  daily_loss_limit_pct: 5.0
  position_concentration_pct: 30.0
  single_order_amount_limit: 100000
  max_leverage: 1.0
circuit_breaker:
  auto_reset: false
  cooldown_minutes: 1440
