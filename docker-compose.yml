services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18766:18766"
    volumes:
      - ./backend:/app
      - ./config:/app/config
      - ./workflows:/app/workflows
      - ./knowledge:/app/knowledge
      - ./agents:/app/agents
      - ./evals:/app/evals
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./harness.db
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18766
      - BACKEND_URL=http://backend:18766
    depends_on:
      - backend
    restart: unless-stopped
