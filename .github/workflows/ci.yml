name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Node side: lint + typecheck + build + test, across OS × Node versions
  # =====================================================================
  node:
    name: node (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # =====================================================================
  # Python side: lint + test on Python 3.12 across Linux + macOS
  # =====================================================================
  python:
    name: python (${{ matrix.os }}, py3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 (system, mirrors ADR-0001)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Sync deps (incl. dev)
        run: uv sync --extra dev --python python3.12

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # =====================================================================
  # Aggregate gate — required status check on PRs
  # =====================================================================
  ci-pass:
    name: ci-pass
    runs-on: ubuntu-latest
    needs: [node, python]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [ "${{ needs.node.result }}" != "success" ] || [ "${{ needs.python.result }}" != "success" ]; then
            echo "node=${{ needs.node.result }} python=${{ needs.python.result }}"
            exit 1
          fi
          echo "all green"
