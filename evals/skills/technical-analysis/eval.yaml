# Technical Analysis Skill Eval Suite
name: technical-analysis
description: 验证技术分析技能（MACD/RSI/布林带/均线）的正确性

cases:
  - id: ta-l1-macd-structure
    description: MACD 数据结构完整性
    level: L1
    skill: technical
    inputs:
      symbol: "000001.SH"
      indicator: macd
    expected_contains: "dif"
    regex_match: "diff|dif|dea|histogram"

  - id: ta-l1-rsi-range
    description: RSI 值应在 0-100 范围内
    level: L1
    skill: technical
    inputs:
      symbol: "000001.SH"
      indicator: rsi
    expected_contains: "rsi14"

  - id: ta-l1-ma-trend
    description: 均线系统 trend 字段
    level: L1
    skill: technical
    inputs:
      symbol: "000001.SH"
      indicator: ma
    expected_contains: "trend"
    regex_match: "bullish|bearish|unknown"

  - id: ta-l2-reasoning
    description: 指标输出的交易建议应含分析逻辑
    level: L2
    skill: technical
    inputs:
      symbol: "000001.SH"
      indicator: all
    rubric: "技术指标输出应包含明确的趋势判断（bullish/bearish）和对当前市场状态的描述"
